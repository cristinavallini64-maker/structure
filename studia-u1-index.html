<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grammar Tutor · Unit 1</title>
  <style>
    :root{--ink:#182019;--muted:#5d675e;--paper:#fffdf7;--soft:#f2eddf;--accent:#6f3a82;--accent2:#4d255b;--ok:#26734a;--line:#d8d2c4}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#111712;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
    main{width:min(760px,100%);background:var(--paper);border-radius:20px;box-shadow:0 24px 70px #0008;overflow:hidden}
    header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-weight:800;letter-spacing:.02em}.unit{font-size:.84rem;color:var(--muted)}
    .progress{height:7px;background:#e5dfd1}.progress>span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
    article{padding:clamp(24px,5vw,44px)} .phase{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:800;color:var(--accent)}
    h1{font-size:clamp(1.45rem,4vw,2.05rem);line-height:1.2;margin:.45rem 0 1.25rem}.examples{display:grid;gap:10px;margin:20px 0}.example{padding:16px 18px;background:var(--soft);border-left:4px solid var(--accent);border-radius:8px;font-weight:650}
    .question{font-size:1.06rem;margin:22px 0 14px}.feedback{display:none;padding:12px 14px;border-radius:8px;background:#efe7f3;color:var(--accent2);margin-bottom:14px}.feedback.show{display:block}.feedback.success{background:#e5f5ea;color:#176b3a;border:1px solid #9fd3ae}.feedback.error{background:#fdeaea;color:#922}
    textarea{width:100%;min-height:100px;resize:vertical;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:white;font:inherit;color:inherit}textarea:focus{outline:3px solid #6f3a8222;border-color:var(--accent)}
    .choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.choice{background:white;color:var(--accent2);border:1.5px solid var(--accent);padding:8px 13px;border-radius:999px;cursor:pointer}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}button{font:inherit;font-weight:750;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}.primary:disabled{opacity:.55;cursor:wait}.link{background:transparent;color:var(--muted);padding-left:0}
    .status{font-size:.84rem;color:var(--muted)}.complete{text-align:center;padding:55px 25px}.complete .mark{font-size:3rem;color:var(--ok)}.error{background:#fdeaea;color:#922;padding:12px 14px;border-radius:8px;margin-bottom:14px}
    @media(max-width:520px){body{padding:0}main{min-height:100vh;border-radius:0}.actions{align-items:stretch;flex-direction:column-reverse}.primary{width:100%}}
  </style>
</head>
<body>
<main>
  <header><div><div class="brand">Grammar Tutor</div><div class="unit" id="unitTitle">Caricamento…</div></div><div class="status" id="status"></div></header>
  <div class="progress"><span id="progress"></span></div>
  <article id="lesson" hidden>
    <div class="phase" id="phase"></div><h1 id="prompt"></h1><div class="unit" id="moduleTitle"></div><div class="examples" id="examples"></div>
    <div class="question" id="question"></div><div class="choices" id="choices"></div>
    <form id="answerForm"><div id="inputArea"><label for="answer" class="unit">La tua risposta</label><textarea id="answer" placeholder="Scrivi qui. Invio per inviare; Maiusc + Invio per andare a capo."></textarea></div>
    <p id="submitted" hidden></p><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="actions"><button type="button" class="link" id="restart">Ricomincia</button><button type="submit" class="primary" id="submit">Invia risposta</button></div></form>
  </article>
  <section class="complete" id="complete" hidden><div class="mark">✓</div><h1>Unit 1 completata</h1><p>Hai usato le forme della Unit 1 in frasi contestualizzate e in un cloze finale.</p><button class="primary" id="again">Ricomincia</button></section>
</main>
<script>
  const WORKER_URL = "https://tutor1.cristinavallini64.workers.dev/";
  const storageKey = "grammar-tutor-unit1-v3";
  const $ = id => document.getElementById(id);
  let current=null, pending=null, submitted="", draft="", busy=false;
  const text=(id,value)=>{$(id).textContent=value||""};
  function save(){try{localStorage.setItem(storageKey,JSON.stringify({current,pending,submitted,draft}))}catch{}}
  function setBusy(on){
    busy=on;
    ["submit","answer","restart","again"].forEach(id=>{$(id).disabled=on});
    document.querySelectorAll(".choice").forEach(b=>{b.disabled=on});
    text("submit",on?"Un momento…":pending?"Prosegui · Invio":current?"Invia risposta":"Riprova");
  }
  function focusActive(){if(!busy&&!current?.completed)(pending||!current?$("submit"):$("answer")).focus({preventScroll:true})}
  function render(){
    $("lesson").hidden=Boolean(current?.completed);$("complete").hidden=!current?.completed;
    const fb=$("feedback");fb.className="feedback";text("feedback","");
    if(current?.completed){$("progress").style.width="100%";text("status","Completato");$("again").focus();return}
    if(!current){text("prompt","Apriamo il tutor");text("unitTitle","Unit 1 · Past Narrative");$("inputArea").hidden=true;setBusy(busy);return}
    const a=current.activity;
    text("unitTitle",current.unit.title);text("phase",a.phase);text("prompt",a.prompt);text("question",a.question);
    text("moduleTitle",current.state.topic===5?"Sintesi della Unit 1":`Percorso ${current.module.index} di 5: ${current.module.title}`);
    text("status",pending?"Leggi il feedback":"");
    $("progress").style.width=`${current.state.step/6*100}%`;
    $("examples").replaceChildren(...a.examples.map(t=>{const d=document.createElement("div");d.className="example";d.textContent=t;return d}));
    $("choices").replaceChildren(...(pending?[]:a.choices||[]).map(t=>{
      const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=t;
      b.onclick=()=>{if(busy)return;draft=t;$("answer").value=t;save();$("answer").focus()};return b;
    }));
    $("inputArea").hidden=Boolean(pending);$("submitted").hidden=!pending;$("answer").value=draft;
    if(pending){
      text("submitted","La tua risposta: "+submitted);
      text("feedback",pending.message||"Risposta esaminata.");fb.classList.add("show");
      if(pending.outcome==="correct"||/^(Risposta corretta|Obiettivo verificato)/i.test(pending.message||""))fb.classList.add("success");
    }
    setBusy(busy);focusActive();
  }
  async function call(payload){
    if(busy)return;
    setBusy(true);$("feedback").className="feedback";
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),25000);
    try{
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});
      const data=await res.json().catch(()=>({error:"Risposta non valida dal server."}));
      if(!res.ok)throw new Error(data.error||`Errore ${res.status}`);
      if(!data.state||!data.activity||!data.unit)throw new Error("Risposta incompleta dal tutor. Riprova.");
      if(payload.action==="answer"){pending=data;submitted=payload.answer;draft=""}
      else{current=data;pending=null;submitted="";draft=""}
      save();render();
    }catch(e){$("feedback").className="feedback show error";text("feedback",e.name==="AbortError"?"Il collegamento è lento. La tua risposta è conservata: puoi riprovare.":e.message)}
    finally{clearTimeout(timer);setBusy(false);focusActive()}
  }
  function proceed(){
    if(busy)return;
    if(pending){current=pending;pending=null;submitted="";draft="";save();render();window.scrollTo(0,0);return}
    if(!current){call({action:"start"});return}
    const answer=$("answer").value.trim();if(!answer){$("answer").focus();return}
    draft=answer;save();call({action:"answer",answer,state:current.state});
  }
  $("answerForm").addEventListener("submit",e=>{e.preventDefault();proceed()});
  document.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||e.shiftKey||e.isComposing)return;
    if(e.repeat||busy){e.preventDefault();return}
    if(e.target.tagName==="BUTTON")return;
    if(pending||e.target===$("answer")){e.preventDefault();proceed()}
  });
  $("answer").addEventListener("input",()=>{draft=$("answer").value;save()});
  $("restart").onclick=()=>call({action:"restart"});$("again").onclick=()=>call({action:"restart"});
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
    if(saved?.current?.state&&saved.current.activity){({current,pending=null,submitted="",draft=""}=saved)}
    else{const old=JSON.parse(localStorage.getItem("grammar-tutor-unit1-v2")||"null");if(old?.state&&old.activity)current=old}
  }catch{}
  render();if(!current)call({action:"start"});
</script>
</body>
</html>

      if(!data.state||!data.activity||!data.unit)throw new Error("Risposta incompleta dal tutor. Riprova.");

      pezzi=pezzi.filter(p=>p.l!=="en");
      pezzi.unshift({t:"Voce inglese non disponibile su questo dispositivo: leggo solo le parti in italiano.",l:"it"});
      const fb=$("feedback");if(!fb.classList.contains("show")){fb.className="feedback show";fb.textContent="Voce inglese non disponibile su questo dispositivo: le frasi in inglese non vengono lette."}
    }
    if(!pezzi.length)return;
    $("ascolta").setAttribute("aria-pressed","true");$("ascolta").textContent="⏹ Ferma";
    pezzi.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p.t);
      u.lang=p.l==="en"?"en-GB":"it-IT";const v=scegliVoce(p.l);if(v)u.voice=v;
      u.rate=p.l==="en"?0.85:0.95;
      if(i===pezzi.length-1){u.onend=fermaLettura;u.onerror=fermaLettura}
      voce.speak(u);
    });
  }
  $("ascolta").onclick=leggi;
  if(voce&&voce.onvoiceschanged!==undefined)voce.onvoiceschanged=()=>{};
  const renderOriginale=render;
  render=function(){fermaLettura();renderOriginale()};

  render();call(savedState?{action:"resume",state:savedState}:{action:"start"});
</script>
</body>
</html>

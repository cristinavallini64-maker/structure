<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopri la regola · stop, remember, forget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1216;
    --cyan:#00E5FF;
    --cyan-scuro:#0099aa;
    --testo:#dceef2;
    --tenue:#7fa3ac;
  }
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--testo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    border-bottom:1px solid rgba(0,229,255,.22);
    padding:16px 20px 14px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  header p{font-size:.82rem;color:var(--tenue)}
  header a{
    margin-left:auto;
    font-size:.78rem;
    color:var(--tenue);
    text-decoration:none;
    border:1px solid rgba(0,229,255,.3);
    border-radius:14px;
    padding:4px 12px;
  }
  header a:hover{color:var(--cyan);border-color:var(--cyan)}

  main{
    flex:1;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .bolla{max-width:88%;line-height:1.55;font-size:.96rem;white-space:pre-wrap}
  .tutor{
    align-self:flex-start;
    border-left:3px solid var(--cyan);
    padding:2px 0 2px 14px;
  }
  .studente{
    align-self:flex-end;
    background:rgba(0,229,255,.09);
    border-radius:14px 14px 4px 14px;
    padding:10px 15px;
    color:#eaf9fc;
  }
  .avviso{
    align-self:center;
    font-size:.85rem;
    color:#ffb4a2;
    border:1px dashed rgba(255,180,162,.45);
    border-radius:10px;
    padding:8px 14px;
    max-width:88%;
  }

  .puntini{align-self:flex-start;padding-left:17px;color:var(--cyan-scuro);font-size:1.4rem;letter-spacing:3px}
  .puntini span{animation:p 1.1s infinite}
  .puntini span:nth-child(2){animation-delay:.18s}
  .puntini span:nth-child(3){animation-delay:.36s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.puntini span{animation:none;opacity:.6}}

  footer{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top,var(--bg) 70%,rgba(10,18,22,0));
    padding:14px 18px 20px;
  }
  .barra{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--testo);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,229,255,.28);
    border-radius:12px;
    padding:11px 14px;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent}
  textarea::placeholder{color:#5c7f88}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:.8rem;
    letter-spacing:1px;
    background:var(--cyan);
    color:#04181d;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:700;
  }
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}

  .fine{
    align-self:center;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:.9rem;
    letter-spacing:2px;
    color:var(--cyan);
    border-top:1px solid rgba(0,229,255,.25);
    border-bottom:1px solid rgba(0,229,255,.25);
    padding:12px 22px;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <h1>Scopri la regola</h1>
  <p>stop · remember · forget</p>
  <a href="javascript:window.close()">Chiudi</a>
</header>

<main id="dialogo"></main>

<footer>
  <div class="barra">
    <textarea id="campo" rows="1" placeholder="Rispondi con parole tue…" autocomplete="off"></textarea>
    <button id="invia">Invia</button>
  </div>
</footer>

<script>
// ============================================================
// INDIRIZZO DEL WORKER — da sostituire dopo il deploy su Cloudflare
// ============================================================
const WORKER = "https://grammar-tutor.cristinavallini64.workers.dev";

// ============================================================
// ARGOMENTO DI QUESTO TUTOR
// È l'unica parte da riscrivere per creare il tutor di un'altra regola.
// Il metodo (domande aperte, divieto di dare la regola, italiano) sta nel Worker
// ed è uguale per tutti: il Worker non si tocca mai più.
// ============================================================
// tipo di regola: "contrasto" (due forme, cambia il significato)
//                 "schema"    (un congegno da ricostruire, es. question tags)
//                 "memoria"   (fatto arbitrario, es. quali verbi vogliono -ing)
const TIPO = "contrasto";

// ============================================================
// PRIMA BATTUTA — scritta qui, non generata.
// Compare appena si apre la pagina, sempre identica.
// ============================================================
const APERTURA = `Due frasi vere, tutte e due corrette:

"He stopped smoking."
"He stopped to smoke."

In quale delle due si è acceso una sigaretta?`;

const ARGOMENTO = `I verbi che accettano sia -ing sia to cambiando significato:
STOP, REMEMBER, FORGET, TRY.
Prima di tutto ricorda allo studente che di solito un verbo ne vuole uno solo (enjoy vuole
sempre -ing, decide vuole sempre to): questi sono l'eccezione, e sono pochi.

L'APERTURA è già stata mostrata allo studente dalla pagina: sono le due frasi
"He stopped smoking." / "He stopped to smoke." con la domanda su quale delle due si è acceso
una sigaretta. Il tuo primo turno è la RISPOSTA a quello che lo studente ha appena scritto:
non ripetere l'apertura e non rifarla. Qualunque cosa abbia risposto, passa subito alla
regola di stop.

LA REGOLA DA DIRE NELLA FASE 2 (dilla così, corta, un caso per riga)
stop + -ing = quella cosa finisce. "He stopped smoking." Non fuma più.
stop + to = si ferma per farne un'altra. "He stopped to smoke." La sigaretta se l'è accesa.
   Trucco: se in italiano ci metti "per", in inglese ci va to.
remember/forget + to = c'era un compito da fare. "I remembered to lock the door."
remember/forget + -ing = c'è un fatto già successo che ricordi. "I remember locking the door."
   Trucco: al negativo e nelle domande su un ricordo va quasi sempre -ing
   ("I don't remember going", "Do you remember meeting him?"). Con to lì non si dice.
try + to = l'azione è difficile e puoi non farcela. "I tried to open the window" (non si è
   aperta).
try + -ing = l'azione è facile, la provi per vedere se risolve un problema. "I tried opening
   the window" (l'ho aperta, restava da vedere se serviva).
   try è il più difficile: in italiano si dice "ho provato a" in tutti e due i casi.
   Dagli due item in più rispetto agli altri verbi.

ORDINE DELLA FASE 3 (produzione)
Prima stop, due o tre item. Poi remember e forget insieme, tre o quattro item, di cui almeno
uno al negativo. Poi try, tre o quattro item. Infine quattro item mescolati fra tutti i verbi.
Scene di due righe, di vita quotidiana: la spesa, il compleanno della nonna, il computer che
non va, le chiavi, il compito da consegnare, il divano da spostare.

IL CONFINE DA DIRE ALLA FINE
Questo cambio di significato vale solo per questi verbi e per pochi altri. Con tutti gli altri
non si sceglie: ne vogliono uno solo e basta.

Se ti chiede quali sono gli altri, rispondi che ce ne sono ma che qui si lavora su questi.`;






const dialogo = document.getElementById('dialogo');
const campo   = document.getElementById('campo');
const invia   = document.getElementById('invia');

let storico = [];      // conversazione inviata al Worker
let occupato = false;
let concluso = false;

function bolla(chi, testo){
  const d = document.createElement('div');
  d.className = 'bolla ' + chi;
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function avviso(testo){
  const d = document.createElement('div');
  d.className = 'avviso';
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

function puntini(){
  const d = document.createElement('div');
  d.className = 'puntini';
  d.innerHTML = '<span>·</span><span>·</span><span>·</span>';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function chiudi(){
  concluso = true;
  campo.disabled = true;
  invia.disabled = true;
  const d = document.createElement('div');
  d.className = 'fine';
  d.textContent = 'PERCORSO COMPLETATO';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

// se una chiamata fallisce, l'ultima risposta dello studente NON deve restare
// nello storico: altrimenti al tentativo dopo si inviano due turni di fila
// dello studente e il tutor rifiuta per sempre.
function annullaUltimoTurno(){
  const ultimo = storico[storico.length - 1];
  if(ultimo && ultimo.role === 'user'){
    storico.pop();
    const bolle = dialogo.querySelectorAll('.studente');
    if(bolle.length) bolle[bolle.length - 1].remove();
    campo.value = ultimo.content;
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
    return true;
  }
  return false;
}

async function chiama(){
  const r = await fetch(WORKER, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tipo: TIPO, argomento: ARGOMENTO, messages: storico })
  });
  const dati = await r.json();
  return { ok: r.ok, dati: dati };
}

async function parla(){
  occupato = true;
  invia.disabled = true;
  const attesa = puntini();

  let esito = null;
  try{
    esito = await chiama();
  } catch(e){
    // un tentativo in più: sulle reti scolastiche cade spesso la prima chiamata
    await new Promise(r => setTimeout(r, 1200));
    try { esito = await chiama(); } catch(e2){ esito = null; }
  }

  attesa.remove();

  if(esito === null){
    const recuperato = annullaUltimoTurno();
    avviso(recuperato
      ? 'Connessione caduta. La tua risposta è tornata nel riquadro: premi Invia per riprovare.'
      : 'Connessione caduta. Ricarica la pagina per ricominciare.');
  } else if(!esito.ok || !esito.dati.reply){
    annullaUltimoTurno();
    avviso((esito.dati && esito.dati.error) || 'Il tutor non risponde. Riprova fra poco.');
  } else {
    let testo = esito.dati.reply;
    const finito = /PERCORSO COMPLETATO/i.test(testo);
    testo = testo.replace(/PERCORSO COMPLETATO/ig, '').trim();
    if(testo) bolla('tutor', testo);
    storico.push({ role:'assistant', content: esito.dati.reply });
    if(finito) chiudi();
  }

  occupato = false;
  if(!concluso){
    invia.disabled = false;
    campo.focus();
  }
}

function manda(){
  if(occupato || concluso) return;
  const testo = campo.value.trim();
  if(!testo) return;
  bolla('studente', testo);
  storico.push({ role:'user', content: testo });
  campo.value = '';
  campo.style.height = 'auto';
  parla();
}

invia.addEventListener('click', manda);

campo.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); manda(); }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

// avvio: la prima battuta è fissa, non si chiede al Worker.
// Resta comunque nello storico, così il tutor sa da dove si riparte.
storico.push({ role:'user', content: 'Cominciamo.' });
storico.push({ role:'assistant', content: APERTURA });
bolla('tutor', APERTURA);
campo.focus();
</script>
</body>
</html>

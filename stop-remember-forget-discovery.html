<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopri la regola · stop, remember, forget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1216;
    --cyan:#00E5FF;
    --cyan-scuro:#0099aa;
    --testo:#dceef2;
    --tenue:#7fa3ac;
  }
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--testo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    border-bottom:1px solid rgba(0,229,255,.22);
    padding:16px 20px 14px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  header p{font-size:.82rem;color:var(--tenue)}
  header a{
    margin-left:auto;
    font-size:.78rem;
    color:var(--tenue);
    text-decoration:none;
    border:1px solid rgba(0,229,255,.3);
    border-radius:14px;
    padding:4px 12px;
  }
  header a:hover{color:var(--cyan);border-color:var(--cyan)}

  main{
    flex:1;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .bolla{max-width:88%;line-height:1.55;font-size:.96rem;white-space:pre-wrap}
  .tutor{
    align-self:flex-start;
    border-left:3px solid var(--cyan);
    padding:2px 0 2px 14px;
  }
  .studente{
    align-self:flex-end;
    background:rgba(0,229,255,.09);
    border-radius:14px 14px 4px 14px;
    padding:10px 15px;
    color:#eaf9fc;
  }
  .avviso{
    align-self:center;
    font-size:.85rem;
    color:#ffb4a2;
    border:1px dashed rgba(255,180,162,.45);
    border-radius:10px;
    padding:8px 14px;
    max-width:88%;
  }

  .puntini{align-self:flex-start;padding-left:17px;color:var(--cyan-scuro);font-size:1.4rem;letter-spacing:3px}
  .puntini span{animation:p 1.1s infinite}
  .puntini span:nth-child(2){animation-delay:.18s}
  .puntini span:nth-child(3){animation-delay:.36s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.puntini span{animation:none;opacity:.6}}

  footer{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top,var(--bg) 70%,rgba(10,18,22,0));
    padding:14px 18px 20px;
  }
  .barra{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--testo);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,229,255,.28);
    border-radius:12px;
    padding:11px 14px;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent}
  textarea::placeholder{color:#5c7f88}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:.8rem;
    letter-spacing:1px;
    background:var(--cyan);
    color:#04181d;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:700;
  }
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}

  .intro{
    align-self:stretch;
    border:1px solid rgba(0,229,255,.28);
    border-radius:14px;
    padding:18px 20px 16px;
    background:rgba(0,229,255,.04);
  }
  .intro h2{
    font-family:'Orbitron',sans-serif;
    font-size:.82rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .intro p{font-size:.92rem;line-height:1.6;margin-bottom:9px}
  .intro p:last-child{margin-bottom:0}
  .intro .chiave{color:var(--cyan)}
  .intro .nota{color:var(--tenue);font-size:.85rem}

  .fine{
    align-self:center;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:.9rem;
    letter-spacing:2px;
    color:var(--cyan);
    border-top:1px solid rgba(0,229,255,.25);
    border-bottom:1px solid rgba(0,229,255,.25);
    padding:12px 22px;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <h1>Scopri la regola</h1>
  <p>stop · remember · forget</p>
  <a href="javascript:window.close()">Chiudi</a>
</header>

<main id="dialogo"></main>

<footer>
  <div class="barra">
    <textarea id="campo" rows="1" placeholder="Rispondi con parole tue…" autocomplete="off"></textarea>
    <button id="invia">Invia</button>
  </div>
</footer>

<script>
// ============================================================
// INDIRIZZO DEL WORKER
// ============================================================
const WORKER = "https://grammar-tutor.cristinavallini64.workers.dev";

// ============================================================
// TIPO DI REGOLA
//   "contrasto" = due forme entrambe corrette, cambia il significato
//   "schema"    = un congegno da ricostruire (es. question tags)
//   "memoria"   = fatto arbitrario, non c'è niente da scoprire
// ============================================================
const TIPO = "contrasto";

// ============================================================
// ARGOMENTO DI QUESTO PERCORSO
// È l'UNICA parte da riscrivere per fare il tutor di un'altra regola.
// Il metodo (mai la regola, tre tentativi, traduzione a richiesta,
// criterio di uscita, italiano semplice) sta tutto nel Worker
// ed è uguale per tutti: il Worker non si tocca più.
//
// Nota: le situazioni NON stanno qui. Le costruisce il tutor una per una,
// adattandole allo studente. Qui ci sono solo i CASI da coprire e i vincoli.
// ============================================================
const ARGOMENTO = `Le strutture con STOP, REMEMBER e FORGET seguite dalla forma in -ing
oppure dalla forma col to.
Solo questi tre verbi. Mai try, mai go on, mai altri verbi con lo stesso comportamento.

I CASI DA COPRIRE (sono quattro, e valgono per il criterio di chiusura)
1. stop + forma in -ing  -> quella cosa non la fa più
2. stop + forma col to   -> si è interrotto per fare un'altra cosa, e quella cosa l'ha fatta
3. remember / forget + forma col to  -> c'era un compito da fare
4. remember / forget + forma in -ing -> si parla di una cosa già successa

IL CRITERIO DI CHIUSURA VA APPLICATO PER VERBO, SEPARATAMENTE:
- stop (i due casi 1 e 2 messi a confronto)
- remember (i due casi)
- forget (i due casi)
Un verbo è "fatto" quando lo studente ha scelto giusto due o tre volte di fila su
quel verbo, con le due forme mescolate. Finché un verbo non è fatto, continui su quello.

COME DEVONO ESSERE LE SITUAZIONI DI QUESTO ARGOMENTO
Qui la frase da sola non basta MAI: "He stopped reading" e "He stopped to read" sono
tutte e due inglese corretto. Quello che decide è il racconto.
- per stop + -ing serve un prima e un dopo: c'era un'abitudine, un lavoro, una cosa
  che si faceva regolarmente, e adesso non c'è più;
- per stop + to serve qualcuno in mezzo a un'altra attività, che si interrompe apposta
  e poi riprende;
- per remember/forget + to serve un compito con una conseguenza visibile
  (la bolletta a stima, il tavolo che non risulta, il modulo mai caricato);
- per remember/forget + -ing serve un fatto già avvenuto e un ricordo che lo riguarda,
  spesso in contrasto con qualcuno che sostiene il contrario.

DUE PROVE DA FARE PRIMA DI MANDARE UNA SITUAZIONE

Prova 1 — l'altra forma deve essere esclusa. Se anche l'altra forma ci starebbe dentro,
la situazione è da rifare. Non basta che sia "un po' più probabile".

Prova 2 — l'italiano NON deve contenere la risposta. Il racconto italiano si ferma prima
del finale: è la frase inglese che dice come è andata. Se lo studente può rispondere
ricopiando il racconto senza leggere l'inglese, l'item è rotto.

  SBAGLIATA: "Dario faceva atletica tre volte a settimana. Poi si è fatto male al ginocchio
  e ora non si allena più." — "Dario stopped training." — Dario si allena ancora?
  Qui la risposta è già scritta in italiano: non serve l'inglese.

  GIUSTA: "Dario correva i 1500 a livello agonistico. Due anni fa un problema al ginocchio
  l'ha tenuto fermo per mesi di fisioterapia." — "Dario stopped training after the injury."
  — Dario oggi si allena?
  Qui la fisioterapia non dice come è finita: uno può benissimo essere tornato in pista.
  La risposta sta solo nell'inglese.

VARIA. Non ricadere sempre sulle stesse due o tre scene: il caffè, le chiavi, il pane
vanno bene ma non possono essere gli unici. Usa scuola, lavoretti estivi, sport,
volontariato, viaggi, patente, musica, cucina, condominio, ufficio, ospedale, concerti.
Lessico da B1+ verso B2.

L'INTRODUZIONE L'HA GIÀ DATA LA PAGINA
Lo studente ha già letto come funziona il percorso e che può chiedere il significato
delle parole. Non ripetere niente di tutto questo, non salutare, non presentarti:
il tuo primo turno è direttamente la prima situazione.
`;

const dialogo = document.getElementById('dialogo');
const campo   = document.getElementById('campo');
const invia   = document.getElementById('invia');

let storico = [];
let occupato = false;
let concluso = false;

// Il modello ogni tanto usa il markdown nonostante il divieto: lo togliamo qui,
// così lo studente non vede mai asterischi o cancelletti.
function ripulisci(t){
  return String(t)
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/(^|[\s(])\*(\S(?:.*?\S)?)\*(?=[\s).,;:!?]|$)/g, '$1$2')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*]\s+/gm, '- ')
    .trim();
}

function bolla(chi, testo){
  testo = ripulisci(testo);
  const d = document.createElement('div');
  d.className = 'bolla ' + chi;
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function avviso(testo){
  const d = document.createElement('div');
  d.className = 'avviso';
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

function puntini(){
  const d = document.createElement('div');
  d.className = 'puntini';
  d.innerHTML = '<span>·</span><span>·</span><span>·</span>';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function chiudi(){
  concluso = true;
  campo.disabled = true;
  invia.disabled = true;
  const d = document.createElement('div');
  d.className = 'fine';
  d.textContent = 'PERCORSO COMPLETATO';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

// se una chiamata fallisce, l'ultima risposta dello studente NON deve restare
// nello storico: altrimenti al tentativo dopo si inviano due turni di fila
// dello studente e il tutor rifiuta per sempre.
function annullaUltimoTurno(){
  const ultimo = storico[storico.length - 1];
  if(ultimo && ultimo.role === 'user' && ultimo.content !== 'Cominciamo.'){
    storico.pop();
    const bolle = dialogo.querySelectorAll('.studente');
    if(bolle.length) bolle[bolle.length - 1].remove();
    campo.value = ultimo.content;
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
    return true;
  }
  return false;
}

async function chiama(){
  const r = await fetch(WORKER, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tipo: TIPO, argomento: ARGOMENTO, messages: storico })
  });
  const dati = await r.json();
  return { ok: r.ok, dati: dati };
}

async function parla(){
  occupato = true;
  invia.disabled = true;
  const attesa = puntini();

  let esito = null;
  try{
    esito = await chiama();
  } catch(e){
    // un tentativo in più: sulle reti scolastiche cade spesso la prima chiamata
    await new Promise(r => setTimeout(r, 1200));
    try { esito = await chiama(); } catch(e2){ esito = null; }
  }

  attesa.remove();

  if(esito === null){
    const recuperato = annullaUltimoTurno();
    avviso(recuperato
      ? 'Connessione caduta. La tua risposta è tornata nel riquadro: premi Invia per riprovare.'
      : 'Connessione caduta. Ricarica la pagina per ricominciare.');
  } else if(!esito.ok || !esito.dati.reply){
    annullaUltimoTurno();
    avviso((esito.dati && esito.dati.error) || 'Il tutor non risponde. Riprova fra poco.');
  } else {
    let testo = esito.dati.reply;
    const finito = /PERCORSO COMPLETATO/i.test(testo);
    testo = testo.replace(/PERCORSO COMPLETATO/ig, '').trim();
    if(testo) bolla('tutor', testo);
    storico.push({ role:'assistant', content: esito.dati.reply });
    if(finito) chiudi();
  }

  occupato = false;
  if(!concluso){
    invia.disabled = false;
    campo.focus();
  }
}

function manda(){
  if(occupato || concluso) return;
  const testo = campo.value.trim();
  if(!testo) return;
  bolla('studente', testo);
  storico.push({ role:'user', content: testo });
  campo.value = '';
  campo.style.height = 'auto';
  parla();
}

invia.addEventListener('click', manda);

campo.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); manda(); }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

// ============================================================
// INTRODUZIONE — fissa, scritta qui.
// Compare subito, senza aspettare la rete. Il tutor sa che c'è già
// (glielo dice ARGOMENTO) e parte direttamente dalla prima situazione.
// ============================================================
function introduzione(){
  const d = document.createElement('div');
  d.className = 'intro';
  d.innerHTML =
    '<h2>Come funziona</h2>' +
    '<p>Impariamo qualcosa di nuovo. Ti faccio vedere l\u2019inglese all\u2019opera e ti ' +
    'faccio delle domande: si va avanti un pezzo per volta, senza fretta.</p>' +
    '<p>Rispondi come ti viene, in italiano. Se sbagli non è un problema: ' +
    'ti faccio una domanda che ti aiuta a guardare nel punto giusto.</p>' +
    '<p>Se c\u2019è una parola che non conosci — o non sai come si dice in inglese una ' +
    'parola italiana — <span class="chiave">chiedimela quando vuoi</span>. ' +
    'Non conta come errore.</p>' +
    '<p class="nota">Nessun voto, nessun cronometro. Si va avanti finché non ti viene ' +
    'naturale. Cominciamo.</p>';
  dialogo.appendChild(d);
}

// Avvio: introduzione fissa a video, poi il tutor manda la prima situazione.
introduzione();
storico.push({ role:'user', content: 'Cominciamo.' });
parla();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopri la regola · stop, remember, forget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1216;
    --cyan:#00E5FF;
    --cyan-scuro:#0099aa;
    --testo:#dceef2;
    --tenue:#7fa3ac;
  }
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--testo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    border-bottom:1px solid rgba(0,229,255,.22);
    padding:16px 20px 14px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  header p{font-size:.82rem;color:var(--tenue)}
  header a{
    margin-left:auto;
    font-size:.78rem;
    color:var(--tenue);
    text-decoration:none;
    border:1px solid rgba(0,229,255,.3);
    border-radius:14px;
    padding:4px 12px;
  }
  header a:hover{color:var(--cyan);border-color:var(--cyan)}

  main{
    flex:1;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .bolla{max-width:88%;line-height:1.55;font-size:.96rem;white-space:pre-wrap}
  .tutor{
    align-self:flex-start;
    border-left:3px solid var(--cyan);
    padding:2px 0 2px 14px;
  }
  .studente{
    align-self:flex-end;
    background:rgba(0,229,255,.09);
    border-radius:14px 14px 4px 14px;
    padding:10px 15px;
    color:#eaf9fc;
  }
  .avviso{
    align-self:center;
    font-size:.85rem;
    color:#ffb4a2;
    border:1px dashed rgba(255,180,162,.45);
    border-radius:10px;
    padding:8px 14px;
    max-width:88%;
  }

  .puntini{align-self:flex-start;padding-left:17px;color:var(--cyan-scuro);font-size:1.4rem;letter-spacing:3px}
  .puntini span{animation:p 1.1s infinite}
  .puntini span:nth-child(2){animation-delay:.18s}
  .puntini span:nth-child(3){animation-delay:.36s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.puntini span{animation:none;opacity:.6}}

  footer{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top,var(--bg) 70%,rgba(10,18,22,0));
    padding:14px 18px 20px;
  }
  .barra{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--testo);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,229,255,.28);
    border-radius:12px;
    padding:11px 14px;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent}
  textarea::placeholder{color:#5c7f88}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:.8rem;
    letter-spacing:1px;
    background:var(--cyan);
    color:#04181d;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:700;
  }
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}

  .fine{
    align-self:center;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:.9rem;
    letter-spacing:2px;
    color:var(--cyan);
    border-top:1px solid rgba(0,229,255,.25);
    border-bottom:1px solid rgba(0,229,255,.25);
    padding:12px 22px;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <h1>Scopri la regola</h1>
  <p>stop · remember · forget</p>
  <a href="javascript:window.close()">Chiudi</a>
</header>

<main id="dialogo"></main>

<footer>
  <div class="barra">
    <textarea id="campo" rows="1" placeholder="Rispondi con parole tue…" autocomplete="off"></textarea>
    <button id="invia">Invia</button>
  </div>
</footer>

<script>
// ============================================================
// INDIRIZZO DEL WORKER — da sostituire dopo il deploy su Cloudflare
// ============================================================
const WORKER = "https://grammar-tutor.cristinavallini64.workers.dev";

// ============================================================
// ARGOMENTO DI QUESTO TUTOR
// È l'unica parte da riscrivere per creare il tutor di un'altra regola.
// Il metodo (domande aperte, divieto di dare la regola, italiano) sta nel Worker
// ed è uguale per tutti: il Worker non si tocca mai più.
// ============================================================
// tipo di regola: "contrasto" (due forme, cambia il significato)
//                 "schema"    (un congegno da ricostruire, es. question tags)
//                 "memoria"   (fatto arbitrario, es. quali verbi vogliono -ing)
const TIPO = "contrasto";

const ARGOMENTO = `Le strutture con STOP, REMEMBER, FORGET seguite da -ing oppure da to.
Con questi verbi cambia il significato della frase.
- stop + -ing = ha smesso di fare quella cosa
- stop + to = si è fermato per fare un'altra cosa
- remember/forget + -ing = sta parlando di una cosa successa, che ha in mente (o non ha
  più in mente): "me lo ricordo", "non me lo ricordo"
- remember/forget + to = c'era un compito da fare, qualcosa che non doveva dimenticare:
  "me ne sono ricordato e l'ho fatto", "me ne sono dimenticato e non l'ho fatto"
La differenza sta in che cosa vuoi dire, non in cosa ti passa per la testa: con -ing parli
di un fatto che ricordi, con to parli di un dovere che avevi.

COME DEVI PARLARE
Parla come parleresti in classe a ragazzi di sedici anni. Frasi corte, parole di tutti i
giorni. Di' quello che le persone FANNO, non descrivere in astratto quello che succede.
Di' "hanno smesso di comprare le pizze", non "hanno modificato la loro abitudine".
Di' "si è fermato a comprare il pane", non "ha interrotto l'azione per uno scopo".
Vietate le parole: abitudine, azione, situazione, scopo, contesto, interrompere, avvenire,
compiere, svolgersi. Se ti viene una di queste parole, riscrivi la frase con un verbo normale.

LE SCENE
Ogni scena dice in due righe chi sono, dove sono e cosa sta succedendo in quel momento.
Cose che si vedono: qualcuno apre il frigo, guarda il telefono, torna a casa, cerca le chiavi.
Non scene vaghe come "parlano di come è cambiata la loro settimana": da lì non si capisce
niente e ti costringe a parlare astratto.

Passi del percorso:
Passo 1. Scena: due che dividono l'appartamento guardano quanto hanno speso in un mese di
   pizze e sushi a domicilio. Sono cifre alte e decidono di darci un taglio.
   Dentro questa scena presenti le due frasi:
   "We stopped buying takeaway food." / "We stopped to buy takeaway food."
   Chiedi: in quale delle due hanno smesso davvero con le consegne a domicilio?
Passo 2. Due o tre scene brevi dello stesso tipo, sempre concrete (uno che corre e si ferma
   davanti a un bar, uno che gioca ai videogiochi fino a tardi), in cui lo studente sceglie
   fra le due forme e dice cosa succede in quella frase lì.
Passo 3. Qui servono DUE scene separate, non una: la differenza si vede solo cambiando
   la conversazione.
   Prima scena: la madre di Giulia, prima di uscire, le raccomanda di chiudere a chiave
   perché la settimana scorsa sono entrati i ladri dai vicini. La sera si rivedono e la
   madre chiede se ha chiuso. Giulia risponde:
   "Don't worry, I remembered to lock the door."
   Chiedi che cosa vuole far sapere alla madre con questa frase.
   Seconda scena: Marco e la sorella tornano a casa e trovano la porta socchiusa. Lei lo
   accusa di aver lasciato aperto. Lui è sicuro di no e risponde:
   "But I remember locking the door!"
   Chiedi che cosa sta facendo Marco con questa frase.
   Poi le metti a confronto: nella prima Giulia dice di non essersi dimenticata di un compito
   che aveva; nel secondo Marco dice che quella cosa è successa e lui se la ricorda.
   Non parlare di filmati, immagini o ricordi nella testa: parla di quello che ognuno dei due
   vuole far capire all'altro.
Passo 4. Due o tre scene brevi con remember e con forget: il compleanno della nonna, le
   chiavi lasciate dentro, il compito da consegnare. Devono comparire tutti e due i verbi:
   forget è quello su cui gli studenti italiani sbagliano di più.

Alla fine tre frasi da completare, una su stop, una su remember, una su forget, con cose
di tutti i giorni.

Nel riepilogo di' i tre verbi uno per riga, in parole semplici.
E di' anche fin dove arriva questa storia: funziona con stop, remember e forget e con pochi
altri verbi. Con gli altri non si può scegliere, ne vogliono uno solo e basta (dopo enjoy ci
va sempre -ing, dopo decide sempre to).

Se ti chiede quali sono gli altri verbi, rispondi che ce ne sono, ma che qui si lavora su
questi tre.`;




const dialogo = document.getElementById('dialogo');
const campo   = document.getElementById('campo');
const invia   = document.getElementById('invia');

let storico = [];      // conversazione inviata al Worker
let occupato = false;
let concluso = false;

function bolla(chi, testo){
  const d = document.createElement('div');
  d.className = 'bolla ' + chi;
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function avviso(testo){
  const d = document.createElement('div');
  d.className = 'avviso';
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

function puntini(){
  const d = document.createElement('div');
  d.className = 'puntini';
  d.innerHTML = '<span>·</span><span>·</span><span>·</span>';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function chiudi(){
  concluso = true;
  campo.disabled = true;
  invia.disabled = true;
  const d = document.createElement('div');
  d.className = 'fine';
  d.textContent = 'PERCORSO COMPLETATO';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

// se una chiamata fallisce, l'ultima risposta dello studente NON deve restare
// nello storico: altrimenti al tentativo dopo si inviano due turni di fila
// dello studente e il tutor rifiuta per sempre.
function annullaUltimoTurno(){
  const ultimo = storico[storico.length - 1];
  if(ultimo && ultimo.role === 'user'){
    storico.pop();
    const bolle = dialogo.querySelectorAll('.studente');
    if(bolle.length) bolle[bolle.length - 1].remove();
    campo.value = ultimo.content;
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
    return true;
  }
  return false;
}

async function chiama(){
  const r = await fetch(WORKER, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tipo: TIPO, argomento: ARGOMENTO, messages: storico })
  });
  const dati = await r.json();
  return { ok: r.ok, dati: dati };
}

async function parla(){
  occupato = true;
  invia.disabled = true;
  const attesa = puntini();

  let esito = null;
  try{
    esito = await chiama();
  } catch(e){
    // un tentativo in più: sulle reti scolastiche cade spesso la prima chiamata
    await new Promise(r => setTimeout(r, 1200));
    try { esito = await chiama(); } catch(e2){ esito = null; }
  }

  attesa.remove();

  if(esito === null){
    const recuperato = annullaUltimoTurno();
    avviso(recuperato
      ? 'Connessione caduta. La tua risposta è tornata nel riquadro: premi Invia per riprovare.'
      : 'Connessione caduta. Ricarica la pagina per ricominciare.');
  } else if(!esito.ok || !esito.dati.reply){
    annullaUltimoTurno();
    avviso((esito.dati && esito.dati.error) || 'Il tutor non risponde. Riprova fra poco.');
  } else {
    let testo = esito.dati.reply;
    const finito = /PERCORSO COMPLETATO/i.test(testo);
    testo = testo.replace(/PERCORSO COMPLETATO/ig, '').trim();
    if(testo) bolla('tutor', testo);
    storico.push({ role:'assistant', content: esito.dati.reply });
    if(finito) chiudi();
  }

  occupato = false;
  if(!concluso){
    invia.disabled = false;
    campo.focus();
  }
}

function manda(){
  if(occupato || concluso) return;
  const testo = campo.value.trim();
  if(!testo) return;
  bolla('studente', testo);
  storico.push({ role:'user', content: testo });
  campo.value = '';
  campo.style.height = 'auto';
  parla();
}

invia.addEventListener('click', manda);

campo.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); manda(); }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

// avvio: il tutor parla per primo
storico.push({ role:'user', content: 'Cominciamo.' });
parla();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopri la regola · stop, remember, forget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1216;
    --cyan:#00E5FF;
    --cyan-scuro:#0099aa;
    --testo:#dceef2;
    --tenue:#7fa3ac;
  }
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--testo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    border-bottom:1px solid rgba(0,229,255,.22);
    padding:16px 20px 14px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  header p{font-size:.82rem;color:var(--tenue)}
  header a{
    margin-left:auto;
    font-size:.78rem;
    color:var(--tenue);
    text-decoration:none;
    border:1px solid rgba(0,229,255,.3);
    border-radius:14px;
    padding:4px 12px;
  }
  header a:hover{color:var(--cyan);border-color:var(--cyan)}

  main{
    flex:1;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .bolla{max-width:88%;line-height:1.55;font-size:.96rem;white-space:pre-wrap}
  .tutor{
    align-self:flex-start;
    border-left:3px solid var(--cyan);
    padding:2px 0 2px 14px;
  }
  .studente{
    align-self:flex-end;
    background:rgba(0,229,255,.09);
    border-radius:14px 14px 4px 14px;
    padding:10px 15px;
    color:#eaf9fc;
  }
  .avviso{
    align-self:center;
    font-size:.85rem;
    color:#ffb4a2;
    border:1px dashed rgba(255,180,162,.45);
    border-radius:10px;
    padding:8px 14px;
    max-width:88%;
  }

  .puntini{align-self:flex-start;padding-left:17px;color:var(--cyan-scuro);font-size:1.4rem;letter-spacing:3px}
  .puntini span{animation:p 1.1s infinite}
  .puntini span:nth-child(2){animation-delay:.18s}
  .puntini span:nth-child(3){animation-delay:.36s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.puntini span{animation:none;opacity:.6}}

  footer{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top,var(--bg) 70%,rgba(10,18,22,0));
    padding:14px 18px 20px;
  }
  .barra{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--testo);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,229,255,.28);
    border-radius:12px;
    padding:11px 14px;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent}
  textarea::placeholder{color:#5c7f88}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:.8rem;
    letter-spacing:1px;
    background:var(--cyan);
    color:#04181d;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:700;
  }
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}

  .fine{
    align-self:center;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:.9rem;
    letter-spacing:2px;
    color:var(--cyan);
    border-top:1px solid rgba(0,229,255,.25);
    border-bottom:1px solid rgba(0,229,255,.25);
    padding:12px 22px;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <h1>Scopri la regola</h1>
  <p>stop · remember · forget</p>
  <a href="javascript:window.close()">Chiudi</a>
</header>

<main id="dialogo"></main>

<footer>
  <div class="barra">
    <textarea id="campo" rows="1" placeholder="Rispondi con parole tue…" autocomplete="off"></textarea>
    <button id="invia">Invia</button>
  </div>
</footer>

<script>
// ============================================================
// INDIRIZZO DEL WORKER — da sostituire dopo il deploy su Cloudflare
// ============================================================
const WORKER = "https://grammar-tutor.cristinavallini64.workers.dev";

// ============================================================
// ARGOMENTO DI QUESTO TUTOR
// È l'unica parte da riscrivere per creare il tutor di un'altra regola.
// Il metodo (domande aperte, divieto di dare la regola, italiano) sta nel Worker
// ed è uguale per tutti: il Worker non si tocca mai più.
// ============================================================
// tipo di regola: "contrasto" (due forme, cambia il significato)
//                 "schema"    (un congegno da ricostruire, es. question tags)
//                 "memoria"   (fatto arbitrario, es. quali verbi vogliono -ing)
const TIPO = "contrasto";

// ============================================================
// PRIMA BATTUTA — scritta qui, non generata.
// Compare appena si apre la pagina, sempre identica.
// ============================================================
const APERTURA = `Ciao! Qui non ti spiego la regola dall'inizio: partiamo da due frasi e ci arriviamo insieme. Ci vogliono una decina di minuti.

Due frasi vere, tutte e due corrette:

"He stopped smoking."
"He stopped to smoke."

In quale delle due si è acceso una sigaretta?`;

const ARGOMENTO = `I verbi che accettano sia -ing sia to cambiando significato:
STOP, REMEMBER, FORGET, TRY.
Prima di tutto ricorda allo studente che di solito un verbo ne vuole uno solo (enjoy vuole
sempre -ing, decide vuole sempre to): questi sono l'eccezione, e sono pochi.

L'APERTURA è già stata mostrata allo studente dalla pagina: sono le due frasi
"He stopped smoking." / "He stopped to smoke." con la domanda su quale delle due si è acceso
una sigaretta. Il tuo primo turno è la RISPOSTA a quello che lo studente ha appena scritto:
non ripetere l'apertura e non rifarla.
LA RISPOSTA GIUSTA È LA SECONDA ("He stopped to smoke"): è lì che si accende la sigaretta.
Se lo studente dice "la prima" o "1" ha sbagliato: diglielo chiaro, senza cominciare con
"esatto". Poi passa alla regola.

COME DARE LA REGOLA — SPEZZATA, MAI TUTTA INSIEME
Non dire mai più di mezza regola per turno, e non metterla nello stesso turno dell'esercizio.
Segui questa scaletta.

Nessun preambolo prima del turno A: niente premesse su come funzionano i verbi in generale,
niente annunci del tipo "adesso veniamo alla regola". Si parte diretti.

Turno A: solo questo.
   stop + -ing = quella cosa finisce, non la fai più.
   "He stopped smoking." Non fuma più.
   Poi, nel turno dopo, l'item 2.
Turno B: dopo l'item 3, solo questo.
   stop + to = ti fermi per fare un'altra cosa.
   "He stopped to smoke." Si è fermato e si è acceso una sigaretta.
   Trucco: se in italiano ci metti "per", in inglese ci va to.
   Poi, nel turno dopo, l'item 1.
Turno C: prima degli item su remember e forget, solo questo.
   remember/forget + to = c'era un compito da fare. "I remembered to lock the door."
   remember/forget + -ing = c'è un fatto già successo che ricordi. "I remember locking the door."
   Trucco: al negativo e nelle domande su un ricordo va quasi sempre -ing.
Turno D: prima degli item su try, solo questo.
   try + to = l'azione è difficile e puoi non farcela. "I tried to open the window."
   try + -ing = l'azione è facile, la provi per vedere se risolve. "I tried opening the window."
   In italiano si dice "ho provato a" in tutti e due i casi: è il più difficile dei tre.

GLI ITEM DELLA FASE 3 — USA QUESTI, IN QUEST'ORDINE
Non inventarne altri, non cambiare le scene, non cambiare le frasi inglesi.
Ordine di somministrazione: 2, 3, poi 1, poi dal 4 in avanti in ordine.
Uno per turno. Dai la scena, poi la frase col buco, e aspetti.
Se la risposta è giusta: scrivi la riga di conferma indicata e passi al successivo.
Se è sbagliata: dai la forma giusta, una riga di motivo, e riproponi quell'item più avanti.

-- stop, dopo il turno B --
1. Anna correva al parco. Ha visto un'amica e si è avvicinata per salutarla.
   "Anna stopped ___ to her friend."
   Risposta: to talk. Conferma: si è fermata per parlarle.
-- stop, dopo il turno A --
2. Dario si mangiava le unghie da quando era bambino. Da due mesi non lo fa più.
   "Dario stopped ___ his nails."
   Risposta: biting. Conferma: quel vizio è finito, non lo fa più.
3. Sara beveva due lattine di cola al giorno. Il dentista gliel'ha proibito e ha smesso.
   "Sara stopped ___ cola."
   Risposta: drinking. Conferma: la cola l'ha eliminata del tutto.

-- remember e forget --
4. La madre di Sara le ha chiesto di comprare il pane tornando da scuola. Sara arriva a casa
   a mani vuote.
   "Sara forgot ___ the bread."
   Risposta: to buy. Conferma: c'era da farlo e non l'ha fatto.
5. Leo deve prendere una medicina alle otto di sera. Alle otto in punto gli è venuto in mente
   e l'ha presa.
   "Leo remembered ___ his medicine."
   Risposta: to take. Conferma: c'era da farlo e se n'è ricordato in tempo.
6. Giulia trova in un cassetto una foto di sé bambina in Grecia. Guarda la foto e non le dice
   niente: di quella vacanza non ha nessun ricordo.
   "I don't remember ___ to Greece."
   Risposta: going. Conferma: è un fatto successo, e lei non ce l'ha in mente.
7. Marco e sua sorella litigano: lei dice che ha lasciato il gas acceso. Lui ripensa a
   stamattina e ha in mente il gesto di girare la manopola.
   "But I remember ___ it off!"
   Risposta: turning. Conferma: quel gesto l'ha fatto e se lo ricorda.
8. Anna incontra un compagno delle medie. Vuole sapere se lui ha in mente la festa di Leo di
   due anni fa, dove si erano conosciuti.
   "Do you remember ___ me at Leo's party?"
   Risposta: meeting. Conferma: si parla di una cosa già successa.

-- try --
9. Sara ha il portatile lentissimo. Chiude tutte le schede aperte: le chiude in un secondo,
   ma il computer resta lento.
   "Sara tried ___ all the tabs."
   Risposta: closing. Conferma: chiuderle era facile, era un rimedio per vedere se serviva.
10. Marco vuole spostare il divano da solo. Spinge, tira, ma non si muove.
   "Marco tried ___ the sofa, but it was too heavy."
   Risposta: to lift. Conferma: sollevarlo era difficile e non ce l'ha fatta.
11. Anna aveva mal di testa. Ha bevuto un bicchiere d'acqua per vedere se passava. Berlo era
   facile; il mal di testa è rimasto.
   "Anna tried ___ a glass of water."
   Risposta: drinking. Conferma: berlo era facile, serviva a vedere se il mal di testa passava.
12. Leo vuole aprire un barattolo di marmellata. Stringe, forza, il coperchio non si muove.
   "Leo tried ___ the jar."
   Risposta: to open. Conferma: aprirlo era difficile e non ci è riuscito.

-- mescolati, per finire --
13. Dario aveva promesso alla nonna di chiamarla per il suo compleanno. È sera e il telefono
   non registra nessuna chiamata.
   "Dario forgot ___ his grandmother."
   Risposta: to call. Conferma: c'era da farlo e non l'ha fatto.
14. Giulia studiava da tre ore. Si è alzata dalla scrivania, è andata in cucina e si è fatta
   un caffè.
   "Giulia stopped ___ a coffee."
   Risposta: to make. Conferma: si è fermata per farsi il caffè. (Va bene anche "to get".)
15. Sara non riesce a dormire. Ha spento il telefono un'ora prima di andare a letto per vedere
   se prendeva sonno più in fretta. Spegnerlo non le è costato niente.
   "Sara tried ___ her phone off."
   Risposta: turning. Conferma: spegnerlo era facile, era un rimedio da provare.
16. Marco ha suonato la chitarra per dieci anni. Poi si è rotto un dito e non l'ha più ripresa
   in mano.
   "Marco stopped ___ the guitar."
   Risposta: playing. Conferma: ha smesso e non ha più ricominciato.

IL CONFINE DA DIRE ALLA FINE
Questo cambio di significato vale solo per questi verbi e per pochi altri. Con tutti gli altri
non si sceglie: ne vogliono uno solo e basta.

Se ti chiede quali sono gli altri, rispondi che ce ne sono ma che qui si lavora su questi.`;






const dialogo = document.getElementById('dialogo');
const campo   = document.getElementById('campo');
const invia   = document.getElementById('invia');

let storico = [];      // conversazione inviata al Worker
let occupato = false;
let concluso = false;

// Il modello ogni tanto usa il markdown nonostante il divieto: lo togliamo qui,
// così lo studente non vede mai asterischi o cancelletti.
function ripulisci(t){
  return String(t)
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/(^|[\s(])\*(\S(?:.*?\S)?)\*(?=[\s).,;:!?]|$)/g, '$1$2')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*]\s+/gm, '- ')
    .trim();
}

function bolla(chi, testo){
  testo = ripulisci(testo);
  const d = document.createElement('div');
  d.className = 'bolla ' + chi;
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function avviso(testo){
  const d = document.createElement('div');
  d.className = 'avviso';
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

function puntini(){
  const d = document.createElement('div');
  d.className = 'puntini';
  d.innerHTML = '<span>·</span><span>·</span><span>·</span>';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function chiudi(){
  concluso = true;
  campo.disabled = true;
  invia.disabled = true;
  const d = document.createElement('div');
  d.className = 'fine';
  d.textContent = 'PERCORSO COMPLETATO';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

// se una chiamata fallisce, l'ultima risposta dello studente NON deve restare
// nello storico: altrimenti al tentativo dopo si inviano due turni di fila
// dello studente e il tutor rifiuta per sempre.
function annullaUltimoTurno(){
  const ultimo = storico[storico.length - 1];
  if(ultimo && ultimo.role === 'user'){
    storico.pop();
    const bolle = dialogo.querySelectorAll('.studente');
    if(bolle.length) bolle[bolle.length - 1].remove();
    campo.value = ultimo.content;
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
    return true;
  }
  return false;
}

async function chiama(){
  const r = await fetch(WORKER, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tipo: TIPO, argomento: ARGOMENTO, messages: storico })
  });
  const dati = await r.json();
  return { ok: r.ok, dati: dati };
}

async function parla(){
  occupato = true;
  invia.disabled = true;
  const attesa = puntini();

  let esito = null;
  try{
    esito = await chiama();
  } catch(e){
    // un tentativo in più: sulle reti scolastiche cade spesso la prima chiamata
    await new Promise(r => setTimeout(r, 1200));
    try { esito = await chiama(); } catch(e2){ esito = null; }
  }

  attesa.remove();

  if(esito === null){
    const recuperato = annullaUltimoTurno();
    avviso(recuperato
      ? 'Connessione caduta. La tua risposta è tornata nel riquadro: premi Invia per riprovare.'
      : 'Connessione caduta. Ricarica la pagina per ricominciare.');
  } else if(!esito.ok || !esito.dati.reply){
    annullaUltimoTurno();
    avviso((esito.dati && esito.dati.error) || 'Il tutor non risponde. Riprova fra poco.');
  } else {
    let testo = esito.dati.reply;
    const finito = /PERCORSO COMPLETATO/i.test(testo);
    testo = testo.replace(/PERCORSO COMPLETATO/ig, '').trim();
    if(testo) bolla('tutor', testo);
    storico.push({ role:'assistant', content: esito.dati.reply });
    if(finito) chiudi();
  }

  occupato = false;
  if(!concluso){
    invia.disabled = false;
    campo.focus();
  }
}

function manda(){
  if(occupato || concluso) return;
  const testo = campo.value.trim();
  if(!testo) return;
  bolla('studente', testo);
  storico.push({ role:'user', content: testo });
  campo.value = '';
  campo.style.height = 'auto';
  parla();
}

invia.addEventListener('click', manda);

campo.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); manda(); }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

// avvio: la prima battuta è fissa, non si chiede al Worker.
// Resta comunque nello storico, così il tutor sa da dove si riparte.
storico.push({ role:'user', content: 'Cominciamo.' });
storico.push({ role:'assistant', content: APERTURA });
bolla('tutor', APERTURA);
campo.focus();
</script>
</body>
</html>

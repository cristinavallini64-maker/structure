<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scopri la regola · stop, remember, forget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1216;
    --cyan:#00E5FF;
    --cyan-scuro:#0099aa;
    --testo:#dceef2;
    --tenue:#7fa3ac;
  }
  body{
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--testo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    border-bottom:1px solid rgba(0,229,255,.22);
    padding:16px 20px 14px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Orbitron',sans-serif;
    font-size:1.05rem;
    letter-spacing:2px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  header p{font-size:.82rem;color:var(--tenue)}
  header a{
    margin-left:auto;
    font-size:.78rem;
    color:var(--tenue);
    text-decoration:none;
    border:1px solid rgba(0,229,255,.3);
    border-radius:14px;
    padding:4px 12px;
  }
  header a:hover{color:var(--cyan);border-color:var(--cyan)}

  main{
    flex:1;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .bolla{max-width:88%;line-height:1.55;font-size:.96rem;white-space:pre-wrap}
  .tutor{
    align-self:flex-start;
    border-left:3px solid var(--cyan);
    padding:2px 0 2px 14px;
  }
  .studente{
    align-self:flex-end;
    background:rgba(0,229,255,.09);
    border-radius:14px 14px 4px 14px;
    padding:10px 15px;
    color:#eaf9fc;
  }
  .avviso{
    align-self:center;
    font-size:.85rem;
    color:#ffb4a2;
    border:1px dashed rgba(255,180,162,.45);
    border-radius:10px;
    padding:8px 14px;
    max-width:88%;
  }

  .puntini{align-self:flex-start;padding-left:17px;color:var(--cyan-scuro);font-size:1.4rem;letter-spacing:3px}
  .puntini span{animation:p 1.1s infinite}
  .puntini span:nth-child(2){animation-delay:.18s}
  .puntini span:nth-child(3){animation-delay:.36s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.puntini span{animation:none;opacity:.6}}

  footer{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top,var(--bg) 70%,rgba(10,18,22,0));
    padding:14px 18px 20px;
  }
  .barra{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    font-family:'Poppins',sans-serif;
    font-size:.95rem;
    color:var(--testo);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,229,255,.28);
    border-radius:12px;
    padding:11px 14px;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent}
  textarea::placeholder{color:#5c7f88}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:.8rem;
    letter-spacing:1px;
    background:var(--cyan);
    color:#04181d;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:700;
  }
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}

  .fine{
    align-self:center;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:.9rem;
    letter-spacing:2px;
    color:var(--cyan);
    border-top:1px solid rgba(0,229,255,.25);
    border-bottom:1px solid rgba(0,229,255,.25);
    padding:12px 22px;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <h1>Scopri la regola</h1>
  <p>stop · remember · forget</p>
  <a href="javascript:window.close()">Chiudi</a>
</header>

<main id="dialogo"></main>

<footer>
  <div class="barra">
    <textarea id="campo" rows="1" placeholder="Rispondi con parole tue…" autocomplete="off"></textarea>
    <button id="invia">Invia</button>
  </div>
</footer>

<script>
// ============================================================
// INDIRIZZO DEL WORKER — da sostituire dopo il deploy su Cloudflare
// ============================================================
const WORKER = "https://grammar-tutor.cristinavallini64.workers.dev";

// ============================================================
// ARGOMENTO DI QUESTO TUTOR
// È l'unica parte da riscrivere per creare il tutor di un'altra regola.
// Il metodo (domande aperte, divieto di dare la regola, italiano) sta nel Worker
// ed è uguale per tutti: il Worker non si tocca mai più.
// ============================================================
// tipo di regola: "contrasto" (due forme, cambia il significato)
//                 "schema"    (un congegno da ricostruire, es. question tags)
//                 "memoria"   (fatto arbitrario, es. quali verbi vogliono -ing)
const TIPO = "contrasto";

// ============================================================
// PRIMA BATTUTA — scritta qui, non generata.
// Compare appena si apre la pagina, sempre identica.
// ============================================================
const APERTURA = `Ciao! Qui non ti spiego niente: ti do delle situazioni e la regola la tiri fuori tu. Ci vogliono una decina di minuti.

Dario e Leo lavorano insieme in un cantiere. Alle dieci fanno una pausa: Dario posa gli attrezzi, esce, si appoggia al muro e si accende una sigaretta. Leo lo racconta così:
"He stopped to smoke."

Marco invece fumava un pacchetto al giorno. A gennaio ha buttato l'accendino e da allora non ha più toccato una sigaretta. Sua sorella lo racconta così:
"He stopped smoking."

Uno dei due oggi fuma ancora. Quale?`;


const ARGOMENTO = `Le strutture con STOP, REMEMBER e FORGET seguite da -ing oppure da to.
Solo questi tre verbi. Non parlare di try, go on o altri.
- stop + -ing = ha smesso di fare quella cosa
- stop + to = si è fermato per fare un'altra cosa
- forget/remember + to = c'era un compito da fare
- forget/remember + -ing = si parla di una cosa già successa, che si ricorda o non si ricorda

L'apertura l'ha già data la pagina: Dario che si ferma a fumare in cantiere e Marco che ha
smesso col fumo, con la domanda su chi fuma ancora. La risposta giusta è DARIO.
Se lo studente sbaglia o non sa, diglielo in una riga e vai avanti. Non spiegare, non
commentare la differenza fra le due frasi: il tuo turno dopo è già la situazione A1.

=======================================================================
SERIE A — PER CAPIRE. Qui la scena si ferma PRIMA di dire com'è andata.
La frase inglese è l'unica cosa che dice cosa è successo, e la domanda obbliga a leggerla.
Racconta la scena e la frase esattamente come stanno scritte qui, senza aggiungere dettagli
sul risultato. Poi la domanda. Poi la conferma.
=======================================================================

A1. Dario ha fumato un pacchetto al giorno per anni. Lo incontri oggi davanti a scuola e ti
    dice: "I stopped smoking in January."
    Domanda: se adesso gli chiedi una sigaretta, ce l'ha?
    Risposta: no. Conferma: ha chiuso col fumo, non fuma più.
A2. Sara beveva due lattine di cola al giorno. La incontri al bar e ti dice:
    "I stopped drinking cola."
    Domanda: se le offri una cola, la prende?
    Risposta: no. Conferma: la cola l'ha eliminata.
A3. Marco ha suonato la chitarra per dieci anni. Un amico gli chiede di suonare a una festa
    e lui risponde: "I stopped playing the guitar."
    Domanda: suonerà alla festa?
    Risposta: no. Conferma: non suona più.
A4. Anna doveva essere a casa alle sette. Sono le sette e venti, la chiami e le chiedi dov'è.
    Lei dice: "Sorry, I stopped to buy some bread."
    Domanda: Anna sta ancora tornando a casa, oppure è rimasta dal fornaio?
    Risposta: sta tornando. Conferma: si è fermata un attimo per il pane, poi è ripartita.
A5. Giulia sta studiando da tre ore. Sua sorella entra in camera e non la trova alla
    scrivania. Dalla cucina Giulia dice: "I stopped to make a coffee."
    Domanda: ha finito di studiare per oggi?
    Risposta: no. Conferma: si è fermata solo per il caffè, poi torna sui libri.
A6. La madre di Sara le ha chiesto di comprare il pane tornando da scuola. La sera le chiede
    com'è andata. Sara risponde: "I forgot to buy the bread."
    Domanda: il pane c'è?
    Risposta: no. Conferma: doveva comprarlo e non l'ha fatto.
A7. I vicini di Giulia sono stati derubati la settimana scorsa. La mattina sua madre le
    raccomanda di chiudere a chiave. La sera glielo chiede e Giulia risponde:
    "Don't worry, I remembered to lock the door."
    Domanda: la porta è chiusa?
    Risposta: sì. Conferma: doveva farlo e se n'è ricordata.
A8. Giulia trova in un cassetto una foto di sé bambina davanti al mare, in Grecia. Sua madre
    le chiede se si ricorda quella vacanza. Giulia dice: "I don't remember going to Greece."
    Domanda: in Grecia ci è stata?
    Risposta: sì, ma non se lo ricorda. Conferma: il viaggio c'è stato, il ricordo no.
    (Se lo studente risponde che non ci è stata, è l'errore giusto da correggere: la foto
    dimostra che c'è stata. Fagli notare la foto.)
A9. Marco e sua sorella tornano a casa e trovano la porta socchiusa. Lei gli chiede se
    stamattina ha chiuso lui. Marco dice: "I don't remember locking the door."
    Domanda: Marco sta dicendo che non l'ha chiusa?
    Risposta: no, sta dicendo che non se lo ricorda. Conferma: può averla chiusa, ma non ne
    ha il ricordo.

=======================================================================
SERIE B — PER PRODURRE. Qui la scena dice tutti i fatti e lo studente sceglie la forma.
Dai la scena, poi la frase col buco, e aspetti.
=======================================================================

B1. Dario si mangiava le unghie da quando era bambino. Da due mesi non lo fa più.
    "Dario stopped ___ his nails."
    Risposta: biting. Conferma: quel vizio è finito.
B2. Anna correva al parco. Ha visto un'amica, si è avvicinata per salutarla, e dopo cinque
    minuti ha ripreso a correre.
    "Anna stopped ___ to her friend."
    Risposta: to talk. Conferma: si è fermata per parlarle, poi è ripartita.
B3. Leo deve prendere una medicina alle otto di sera. Alle otto in punto gli è venuto in
    mente e l'ha presa.
    "Leo remembered ___ his medicine."
    Risposta: to take. Conferma: c'era da farlo e se n'è ricordato in tempo.
B4. Dario aveva promesso alla nonna di chiamarla per il compleanno. È sera e il telefono non
    registra nessuna chiamata.
    "Dario forgot ___ his grandmother."
    Risposta: to call. Conferma: doveva farlo e non l'ha fatto.
B5. Anna incontra in stazione un compagno delle medie. Vuole sapere se lui ha in mente la
    festa di Leo di due anni fa, dove si erano conosciuti.
    "Do you remember ___ me at Leo's party?"
    Risposta: meeting. Conferma: si parla di una cosa già successa.
B6. Sara studiava. Si è alzata, è andata in cucina, si è fatta un caffè ed è tornata sui libri.
    "Sara stopped ___ a coffee."
    Risposta: to make. Conferma: si è fermata per farsi il caffè. (Va bene anche "to get".)
B7. Marco giura di aver spento il gas stamattina: ha in mente il gesto di girare la manopola.
    "But I remember ___ it off!"
    Risposta: turning. Conferma: quel gesto l'ha fatto e se lo ricorda.
B8. Giulia doveva consegnare il compito di matematica oggi. Il professore le scrive che non
    l'ha ricevuto.
    "Giulia forgot ___ in her homework."
    Risposta: to hand. Conferma: doveva consegnarlo e non l'ha fatto.

=======================================================================
ORDINE: A1, A2, A3, A4, A5, poi B1, B2, poi A6, A7, A8, A9, poi B3, B4, B5, B6, B7, B8.
Non inventare altre situazioni, non cambiare le scene, non cambiare le frasi inglesi.
Una per turno.
Quando sbaglia non spiegare: rimettigli davanti due situazioni già viste, una per forma, e
chiedigli a quale delle due somiglia quella nuova.

ALLA FINE, e solo alla fine, metti in parole quello che ha visto: una riga per stop + -ing,
una per stop + to, una per forget/remember + to, una per forget/remember + -ing.
E il confine: questo vale per stop, remember e forget e per pochi altri verbi. Con gli altri
non si sceglie, ne vogliono uno solo (dopo enjoy ci va sempre -ing, dopo decide sempre to).
Se ti chiede quali sono gli altri, rispondi che ce ne sono ma che qui si lavora su questi tre.`;







const dialogo = document.getElementById('dialogo');
const campo   = document.getElementById('campo');
const invia   = document.getElementById('invia');

let storico = [];      // conversazione inviata al Worker
let occupato = false;
let concluso = false;

// Il modello ogni tanto usa il markdown nonostante il divieto: lo togliamo qui,
// così lo studente non vede mai asterischi o cancelletti.
function ripulisci(t){
  return String(t)
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/(^|[\s(])\*(\S(?:.*?\S)?)\*(?=[\s).,;:!?]|$)/g, '$1$2')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*]\s+/gm, '- ')
    .trim();
}

function bolla(chi, testo){
  testo = ripulisci(testo);
  const d = document.createElement('div');
  d.className = 'bolla ' + chi;
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function avviso(testo){
  const d = document.createElement('div');
  d.className = 'avviso';
  d.textContent = testo;
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

function puntini(){
  const d = document.createElement('div');
  d.className = 'puntini';
  d.innerHTML = '<span>·</span><span>·</span><span>·</span>';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
  return d;
}

function chiudi(){
  concluso = true;
  campo.disabled = true;
  invia.disabled = true;
  const d = document.createElement('div');
  d.className = 'fine';
  d.textContent = 'PERCORSO COMPLETATO';
  dialogo.appendChild(d);
  d.scrollIntoView({block:'end', behavior:'smooth'});
}

// se una chiamata fallisce, l'ultima risposta dello studente NON deve restare
// nello storico: altrimenti al tentativo dopo si inviano due turni di fila
// dello studente e il tutor rifiuta per sempre.
function annullaUltimoTurno(){
  const ultimo = storico[storico.length - 1];
  if(ultimo && ultimo.role === 'user'){
    storico.pop();
    const bolle = dialogo.querySelectorAll('.studente');
    if(bolle.length) bolle[bolle.length - 1].remove();
    campo.value = ultimo.content;
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
    return true;
  }
  return false;
}

async function chiama(){
  const r = await fetch(WORKER, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tipo: TIPO, argomento: ARGOMENTO, messages: storico })
  });
  const dati = await r.json();
  return { ok: r.ok, dati: dati };
}

async function parla(){
  occupato = true;
  invia.disabled = true;
  const attesa = puntini();

  let esito = null;
  try{
    esito = await chiama();
  } catch(e){
    // un tentativo in più: sulle reti scolastiche cade spesso la prima chiamata
    await new Promise(r => setTimeout(r, 1200));
    try { esito = await chiama(); } catch(e2){ esito = null; }
  }

  attesa.remove();

  if(esito === null){
    const recuperato = annullaUltimoTurno();
    avviso(recuperato
      ? 'Connessione caduta. La tua risposta è tornata nel riquadro: premi Invia per riprovare.'
      : 'Connessione caduta. Ricarica la pagina per ricominciare.');
  } else if(!esito.ok || !esito.dati.reply){
    annullaUltimoTurno();
    avviso((esito.dati && esito.dati.error) || 'Il tutor non risponde. Riprova fra poco.');
  } else {
    let testo = esito.dati.reply;
    const finito = /PERCORSO COMPLETATO/i.test(testo);
    testo = testo.replace(/PERCORSO COMPLETATO/ig, '').trim();
    if(testo) bolla('tutor', testo);
    storico.push({ role:'assistant', content: esito.dati.reply });
    if(finito) chiudi();
  }

  occupato = false;
  if(!concluso){
    invia.disabled = false;
    campo.focus();
  }
}

function manda(){
  if(occupato || concluso) return;
  const testo = campo.value.trim();
  if(!testo) return;
  bolla('studente', testo);
  storico.push({ role:'user', content: testo });
  campo.value = '';
  campo.style.height = 'auto';
  parla();
}

invia.addEventListener('click', manda);

campo.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); manda(); }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

// avvio: la prima battuta è fissa, non si chiede al Worker.
// Resta comunque nello storico, così il tutor sa da dove si riparte.
storico.push({ role:'user', content: 'Cominciamo.' });
storico.push({ role:'assistant', content: APERTURA });
bolla('tutor', APERTURA);
campo.focus();
</script>
</body>
</html>
